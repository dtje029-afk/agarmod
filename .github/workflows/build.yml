name: Build IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        export THEOS=$HOME/theos
        git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
        echo "THEOS=$THEOS" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: |
        brew install ldid
        git clone --depth 1 https://github.com/tyilo/insert_dylib.git "$HOME/insert_dylib"
        xcodebuild -project "$HOME/insert_dylib/insert_dylib.xcodeproj" -configuration Release -quiet
        BIN=$(find "$HOME/insert_dylib" -type f -name insert_dylib | head -n 1)
        sudo cp "$BIN" /usr/local/bin/insert_dylib
        insert_dylib --help >/dev/null || true

    - name: Build dylib
      run: |
        export THEOS=$HOME/theos
        make clean || true
        make package FINALPACKAGE=1

    - name: Prepare binaries
      run: |
        mkdir -p build_output
        DYLIB=$(find .theos/obj packages -name "dtje029mod.dylib" 2>/dev/null | head -n 1 || true)
        if [ -n "$DYLIB" ] && [ -f "$DYLIB" ]; then
          cp "$DYLIB" build_output/dtje029mod.dylib
          cp "$DYLIB" build_output/sharkmod.dylib
        fi
        DEB=$(find packages -name "*.deb" 2>/dev/null | head -n 1 || true)
        if [ -n "$DEB" ] && [ -f "$DEB" ]; then
          cp "$DEB" build_output/
        fi
        ls -la build_output

    - name: Upload Tweak Binaries (deb & dylib)
      uses: actions/upload-artifact@v4
      with:
        name: dtje029mod-binaries
        path: build_output/*
        if-no-files-found: warn

    - name: Fetch base IPA & Package
      id: ipa_step
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BASE_IPA_URL: ${{ secrets.BASE_IPA_URL }}
      run: |
        set +e
        HAVE_BASE=0
        if [ -d "Payload/agar.io.app" ]; then
          echo "Payload already present"
          HAVE_BASE=1
        elif [ -f "base_agario.ipa" ]; then
          echo "Unzipping base_agario.ipa"
          unzip -qo base_agario.ipa && HAVE_BASE=1
        else
          mkdir -p _base
          if gh release download base -p "*.ipa" -D _base --repo "${{ github.repository }}" 2>/dev/null; then
            DOWNLOADED=$(ls _base/*.ipa 2>/dev/null | head -n 1)
            if [ -n "$DOWNLOADED" ]; then
              unzip -qo "$DOWNLOADED" && HAVE_BASE=1
            fi
          elif [ -n "${BASE_IPA_URL:-}" ]; then
            curl -L --fail -o _base/base.ipa "$BASE_IPA_URL"
            unzip -qo _base/base.ipa && HAVE_BASE=1
          fi
        fi

        if [ "$HAVE_BASE" -eq 1 ] && [ -d "Payload/agar.io.app" ]; then
          echo "Base app found, injecting dylib..."
          APP="Payload/agar.io.app"
          BIN="$APP/agar.io"
          FW="$APP/Frameworks"
          mkdir -p "$FW"
          cp build_output/dtje029mod.dylib "$FW/dtje029mod.dylib"
          cp build_output/dtje029mod.dylib "$FW/sharkmod.dylib"
          
          insert_dylib --inplace --strip-codesig --all-yes \
            "@executable_path/Frameworks/dtje029mod.dylib" "$BIN" || true

          ldid -S "$FW/dtje029mod.dylib" || true
          ldid -S "$BIN" || true

          rm -f agario_dtje029.ipa
          zip -r agario_dtje029.ipa Payload -x "*.DS_Store"
          cp agario_dtje029.ipa build_output/
          echo "has_ipa=true" >> "$GITHUB_OUTPUT"
        else
          echo "No base IPA found; built tweak dylib & deb only."
          echo "has_ipa=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: dtje029 Agar.io Mod v1.0.${{ github.run_number }}
        body: |
          ## dtje029 Agar.io Mod

          ### Artifacts:
          - `dtje029mod.dylib` & `sharkmod.dylib`
          - `packages/*.deb`
          - `agario_dtje029.ipa` (indien base app aanwezig)

          ### Lokale installatie op Windows:
          1. Download `dtje029mod.dylib`
          2. Voer lokaal uit: `.\build_local_ipa.ps1`
        files: |
          build_output/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
